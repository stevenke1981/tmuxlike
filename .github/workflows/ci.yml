name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Tests (Windows includes isolated native clipboard + real ConPTY acceptance)
        timeout-minutes: 5
        run: cargo test --locked
      - name: Windows release acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:TMUXLIKE_TEST_EXE = (Resolve-Path target/release/tmuxlike.exe).Path
          cargo test --test windows_acceptance --locked -- --nocapture
      - name: Smoke test (real pty / ConPTY session)
        timeout-minutes: 5
        run: python scripts/smoke.py
