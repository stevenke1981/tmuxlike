name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: '.exe' }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=tmuxlike-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir $name
          cp target/${{ matrix.target }}/release/tmuxlike${{ matrix.ext }} README.md LICENSE $name/
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a $name.zip $name; else tar czf $name.tar.gz $name; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: tmuxlike-*.*
